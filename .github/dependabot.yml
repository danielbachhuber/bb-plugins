version: 2
updates:
  # The root only. Every plugin and shared library is an npm workspace of it,
  # so Dependabot reads each workspace's package.json from here and updates
  # them together with the one lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Monday and Thursday.
      interval: cron
      cronjob: "0 9 * * 1,4"
    cooldown:
      # Wait three days after a release before proposing it, so a broken or
      # compromised version has time to be noticed and pulled first.
      default-days: 3
    ignore:
      # Each plugin pins the SDK of the bb it was last typed against, alongside
      # its engines.bbPluginSdk minimum. `bb plugin types` moves the two
      # together; a bump to the pin alone would leave them disagreeing.
      - dependency-name: "@get-bb/plugin-sdk"
      # @testing-library/jest-dom's matcher types do not merge with Vitest 5's,
      # which fails bb-plugin-super-diff-v1's typecheck. Lift this once jest-dom
      # ships a fix: https://github.com/danielbachhuber/bb-plugins/issues/74
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      # TypeScript 7 drops the JavaScript compiler API that bb-plugin-super-diff-v1
      # uses at runtime to parse test files. Lift this once Super Diff no longer
      # needs it: https://github.com/danielbachhuber/bb-plugins/issues/78
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # @get-bb/plugin-sdk declares these types as a peer at ^7.6.12. With a
      # newer major, npm nests a copy in each plugin instead of the root, and
      # the plugins on the root's copy of the SDK fail typecheck. Lift this
      # once the SDK's peer range allows the new major.
      - dependency-name: "@types/better-sqlite3"
        versions: [">=8.0.0"]
    groups:
      # One pull request for every minor and patch update across the
      # workspaces, instead of one per dependency. Major updates still arrive
      # one at a time.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Monday and Thursday.
      interval: cron
      cronjob: "0 9 * * 1,4"
    cooldown:
      # Wait three days after a release before proposing it, so a broken or
      # compromised version has time to be noticed and pulled first.
      default-days: 3
